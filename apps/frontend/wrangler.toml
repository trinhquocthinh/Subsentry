name = "subsentry-frontend"
compatibility_date = "2024-03-20"
pages_build_output_dir = "dist"

[env.production]
# VITE_API_URL should be set in the Cloudflare Pages dashboard for production to point to your Worker
# Or you can hardcode it here if it's static:
# VITE_API_URL = "https://subsentry-backend.<your-subdomain>.workers.dev"

[env.preview]
# VITE_API_URL can be set here for preview deployments if needed
